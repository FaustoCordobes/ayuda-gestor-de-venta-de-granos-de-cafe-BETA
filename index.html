<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1a10">
<title>Gestor de venta de granos de café · BETA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe6; --paper:#fffcf7; --ink:#2b1a10; --ink2:#5b4636; --muted:#8c7564;
  --line:#e6dacb; --espresso:#2b1a10; --espresso2:#3d2719; --crema:#d9b48f;
  --accent:#b4532a; --accent-soft:#f6e1d4; --ok:#2f6b47; --ok-soft:#dcefe2;
  --warn:#a86a0c; --warn-soft:#fbeccd; --danger:#a3322a; --danger-soft:#f7dcd8;
  --wa:#1f9d55; --wa-dark:#16804a; --radius:14px; --shadow:0 1px 2px rgba(43,26,16,.06),0 4px 16px rgba(43,26,16,.06);
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
.sidebar{background:var(--espresso);color:#f3e7da;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand svg{flex:none}
.brand b{font-family:var(--serif);font-size:18px;display:block;line-height:1.1;color:#fff}
.brand small{color:var(--crema);font-size:12px}
.beta{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;color:#e9dccd;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nav-btn:hover{background:rgba(255,255,255,.06)}
.nav-btn.active{background:var(--espresso2);color:#fff;box-shadow:inset 3px 0 0 var(--crema)}
.nav-btn .count{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#a58d79;padding:14px 12px 4px}
.side-foot{margin-top:auto;font-size:12px;color:#b9a593;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
/* Main */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(245,239,230,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.topbar h1{font-family:var(--serif);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.burger{display:none;border:0;background:transparent;cursor:pointer;padding:6px}
#view{padding:24px 28px 40px;max-width:1280px;width:100%}
.demo-banner{background:var(--warn-soft);border:1px solid #efd6a6;color:#6d4a0d;padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;display:flex;gap:10px;align-items:center}
.demo-banner button{margin-left:auto}
/* Owner footer */
.owner{margin-top:auto;border-top:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:13px;background:var(--paper)}
.owner b{color:var(--ink)}
/* Generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2,.card h3{font-family:var(--serif);margin:0 0 12px;font-weight:700}
.card h2{font-size:19px}.card h3{font-size:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h2,.card-head h3{margin:0}
.card-head .right{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:1.35fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:4px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.hl{background:var(--espresso);color:#fff;border-color:var(--espresso)}
.kpi.hl .l{color:var(--crema)}.kpi.hl .s{color:#e4d3c1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#d4c3b0;background:#fff}
.btn.primary{background:var(--espresso);border-color:var(--espresso);color:#fff}
.btn.primary:hover{background:var(--espresso2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-dark)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(43,26,16,.05)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:#efe6da;color:var(--ink2);white-space:nowrap}
.b-local{background:#e6e0f3;color:#4a3a78}.b-persona{background:#dcebf3;color:#24536e}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}.b-accent{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .main{flex:1;min-width:0}
.li .t{font-weight:700}
.li .d{font-size:13px;color:var(--ink2)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:#efe3d4;color:var(--espresso2)}
.avatar.local{background:#e6e0f3;color:#4a3a78}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty svg{opacity:.5;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.tab.active{background:var(--espresso);border-color:var(--espresso);color:#fff}
.tab .n{opacity:.7;margin-left:4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fbf6ef}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:240px}
.search input{border:0;outline:0;background:transparent;width:100%}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=month],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--crema);box-shadow:0 0 0 3px rgba(217,180,143,.3)}
textarea{resize:vertical;min-height:90px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg label{padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--espresso);color:#fff}
.section-t{font-family:var(--serif);font-size:16px;font-weight:700;margin:20px 0 10px;padding-top:14px;border-top:1px dashed var(--line)}
.items-editor .irow{display:grid;grid-template-columns:2fr 1fr 70px 1.6fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.items-editor .ihead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.items-total{display:flex;justify-content:flex-end;gap:16px;font-size:14px;margin-top:6px;color:var(--ink2)}
.items-total b{color:var(--ink);font-size:16px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(30,18,10,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
.modal.hidden{display:none}
.modal-card{background:var(--paper);border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal-card.wide{max-width:920px}
.modal-card.narrow{max-width:520px}
.modal-card h2{font-family:var(--serif);margin:0 0 4px;font-size:22px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(8px);opacity:0}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--espresso);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
/* WhatsApp preview bubble */
.bubble{background:#e7f7dc;border:1px solid #cfe9bd;border-radius:12px 12px 12px 4px;padding:10px 12px;white-space:pre-wrap;font-size:14px;color:#1d2b17}
.wa-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--wa-dark);font-weight:700}
.qcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.qcard .top{display:flex;gap:10px;align-items:center}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
/* Bars */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .col{width:100%;max-width:56px;background:var(--crema);border-radius:8px 8px 3px 3px;min-height:4px}
.bar.cur .col{background:var(--accent)}
.bar .bv{font-size:12px;font-weight:700;color:var(--ink)}
.bar .bl{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .track{background:#f1e7da;border-radius:6px;height:12px;overflow:hidden}
.hbar .fill{background:var(--espresso2);height:100%;border-radius:6px}
.prod-chip{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:160px}
.prod-chip b{font-family:var(--serif);font-size:20px;display:block}
.info{background:#f3ece2;border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink2)}
.info ol{margin:6px 0 0;padding-left:20px}
.info li{margin:3px 0}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.vars code{background:#efe6da;padding:2px 7px;border-radius:6px;font-size:12px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.chip button{border:0;background:#efe6da;border-radius:999px;width:22px;height:22px;cursor:pointer;line-height:1}
/* Comprobante sheet */
.sheet{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:26px 28px;font-family:var(--sans);font-size:13px;position:relative}
.sheet .sh-head{display:grid;grid-template-columns:1fr 80px 1fr;border:1.5px solid #111;border-radius:4px}
.sheet .sh-head>div{padding:12px 14px}
.sheet .letter{border-left:1.5px solid #111;border-right:1.5px solid #111;text-align:center;padding:8px 4px!important}
.sheet .letter b{font-size:40px;font-family:var(--serif);display:block;line-height:1}
.sheet .letter small{font-size:10px}
.sheet h4{margin:0 0 4px;font-family:var(--serif);font-size:18px}
.sheet .sh-cli{border:1.5px solid #111;border-top:0;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.sheet table{width:100%;border-collapse:collapse;margin-top:14px}
.sheet th{background:#f1f1f1;text-align:left;padding:7px 8px;font-size:12px;border:1px solid #bbb}
.sheet td{padding:7px 8px;border:1px solid #ddd}
.sheet .tot{margin-top:12px;margin-left:auto;width:280px}
.sheet .tot div{display:flex;justify-content:space-between;padding:4px 0}
.sheet .tot .grand{border-top:1.5px solid #111;font-weight:700;font-size:16px;padding-top:7px}
.sheet .stamp{margin-top:18px;border:1.5px dashed #b4532a;color:#8a3a18;padding:8px 12px;border-radius:6px;font-size:12px;text-align:center}
#printArea{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .sheet{border:0;padding:0}
}
/* Bottom nav (mobile) */
.bottomnav{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.g-main{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .burger{display:block}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:20px}
  .topbar .sub{display:none}
  #view{padding:16px 14px 100px}
  .owner{padding:14px 16px 90px}
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .items-editor .irow{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:10px}
  .items-editor .ihead{display:none}
  .hbar{grid-template-columns:100px 1fr 60px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--espresso);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;border:0;background:transparent;color:#d8c7b5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;cursor:pointer;position:relative}
  .bottomnav button.active{color:#fff}
  .bottomnav .dot{position:absolute;top:2px;right:calc(50% - 18px);background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}
  .search{min-width:0;width:100%}
  .hide-m{display:none}
}
</style>
</head>

        Contactar por WhatsApp</a>

  </main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>

<script>
/* =========================================================
   Gestor de venta de granos de café — BETA (demo)
   Propiedad de Cordobes Fausto
   ========================================================= */
const LS_KEY = 'gestorCafeBeta_v1';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONEY = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0});
const money = n => MONEY.format(Math.round(n || 0));
const round100 = n => Math.round(n / 100) * 100;
const round2 = n => Math.round(n * 100) / 100;

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d || 1); };
const today = () => toISO(new Date());
const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (iso, n) => { const d = parse(iso); d.setMonth(d.getMonth() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDate = iso => { if(!iso) return '—'; const d = parse(iso); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtDMY = iso => { if(!iso) return '—'; const d = parse(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const monthKey = iso => iso.slice(0, 7);
const monthLabel = k => { const [y,m] = k.split('-'); return `${MESES_L[+m-1]} ${y}`; };
const firstOfMonth = iso => iso.slice(0, 8) + '01';
const rel = iso => {
  const n = diffDays(today(), iso);
  if (n === 0) return 'hoy'; if (n === 1) return 'mañana'; if (n === -1) return 'ayer';
  return n > 0 ? `en ${n} días` : `hace ${-n} días`;
};
const ago = isoDT => {
  const ms = Date.now() - new Date(isoDT).getTime(); const h = Math.floor(ms / 3600000);
  if (h < 1) return 'hace un momento'; if (h < 24) return `hace ${h} h`; const d = Math.floor(h / 24); return d === 1 ? 'ayer' : `hace ${d} días`;
};

/* ---------- Helpers de negocio ---------- */
const cafe = id => S.cafes.find(c => c.id === id) || {nombre:'(café eliminado)', kgMin:0, kgMay:0};
const pres = id => S.presentaciones.find(p => p.id === id) || {nombre:'?', gramos:0};
const cli = id => S.clientes.find(c => c.id === id);
function precioItem(st, cafeId, presId, lista){
  const c = st.cafes.find(x => x.id === cafeId), p = st.presentaciones.find(x => x.id === presId);
  if (!c || !p) return 0;
  return Math.round((lista === 'mayorista' ? c.kgMay : c.kgMin) * p.gramos / 1000);
}
const precio = (cafeId, presId, lista) => precioItem(S, cafeId, presId, lista);
const molLabel = m => m === 'En grano' ? 'en grano' : `molido p/ ${m.toLowerCase()}`;
const itemTxt = it => `${it.cant} × ${cafe(it.cafeId).nombre} ${pres(it.presId).nombre} (${molLabel(it.molienda)})`;
const itemsTxt = items => items.map(itemTxt).join(' + ');
const itemsTotal = (items, lista) => items.reduce((s,i) => s + (i.precio ?? precio(i.cafeId, i.presId, lista)) * i.cant, 0);
const itemsKg = items => items.reduce((s,i) => s + pres(i.presId).gramos * i.cant, 0) / 1000;
function abonoMensual(st, c){
  const base = c.items.reduce((s,i) => s + precioItem(st, i.cafeId, i.presId, c.lista) * i.cant, 0);
  return round100(base * (30 / c.plan.frecuenciaDias) * (1 - (c.plan.descuento || 0) / 100));
}
const planFin = c => c.plan.duracionMeses > 0 ? addMonths(c.plan.inicio, c.plan.duracionMeses) : null;
const freqTxt = d => ({7:'Semanal', 15:'Quincenal', 30:'Mensual'})[d] || `Cada ${d} días`;
const firstName = c => (c.tipo === 'persona' ? c.nombre : (c.contacto || c.nombre)).split(/[ (]/)[0];
const initials = n => n.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
function letraPara(st, c){
  if (st.config.condIva !== 'Responsable Inscripto') return 'C';
  return c.condIva === 'Responsable Inscripto' ? 'A' : 'B';
}
const fmtNum = (pv, n) => `${String(pv).padStart(4,'0')}-${String(n).padStart(8,'0')}`;
function itemsComp(st, items){
  return items.map(i => {
    const c = st.cafes.find(x => x.id === i.cafeId) || {nombre:'Café'}; const p = st.presentaciones.find(x => x.id === i.presId) || {nombre:''};
    return {desc:`Café ${c.nombre} ${p.nombre} — ${molLabel(i.molienda)}`, cant:i.cant, unit:i.precio, subtotal:i.precio * i.cant};
  });
}
function crearComprobante(st, c, items, fecha, extra = {}){
  const letra = letraPara(st, c);
  const total = items.reduce((s,i) => s + i.subtotal, 0);
  const neto = letra === 'C' ? total : round2(total / 1.21);
  const iva = letra === 'C' ? 0 : round2(total - neto);
  const numero = st.config.numeracion[letra]++;
  const comp = {id:uid(), letra, ptoVta:st.config.ptoVta, numero, fecha, clienteId:c.id,
    cliente:{nombre:c.nombre, docTipo:c.docTipo, docNro:c.docNro, condIva:c.condIva, direccion:c.direccion},
    items, neto, iva, total, pedidoId:extra.pedidoId || null, periodo:extra.periodo || null};
  st.comprobantes.push(comp);
  return comp;
}
function waLink(tel, text){
  let d = String(tel || '').replace(/\D/g, '');
  if (!d.startsWith('54')) { d = d.replace(/^0/, ''); d = '549' + d; }
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

}

/* ================= VISTA: INICIO ================= */

  const d = parse(t);

  const pc = paraConsultar(), es = esperando(), ap = aPreparar(), pr = porRenovar();
  const compMes = S.comprobantes.filter(c => monthKey(c.fecha) === mk);
  const facMes = compMes.reduce((s,c) => s + c.total, 0);
  const pedMes = S.pedidos.filter(p => monthKey(p.fecha) === mk && p.estado !== 'cancelado');
  const kgMes = pedMes.reduce((s,p) => s + itemsKg(p.items), 0);
  const act = activos(); const nLoc = act.filter(c => c.tipo === 'local').length;
  const apKg = ap.reduce((s,p) => s + itemsKg(p.items), 0);
  // facturación últimos 4 meses
  const meses = [3,2,1,0].map(k => monthKey(addMonths(firstOfMonth(t), -k)));
  const facs = meses.map(m => S.comprobantes.filter(c => monthKey(c.fecha) === m).reduce((s,c) => s + c.total, 0));
  const maxF = Math.max(...facs, 1);
  // kg por café (últimos 30 días)
  const kgCafe = {}; S.pedidos.filter(p => diffDays(p.fecha, t) <= 30 && p.estado !== 'cancelado').forEach(p => p.items.forEach(i => { kgCafe[i.cafeId] = (kgCafe[i.cafeId] || 0) + pres(i.presId).gramos * i.cant / 1000; }));
  const kgArr = Object.entries(kgCafe).sort((a,b) => b[1] - a[1]); const maxKg = Math.max(...kgArr.map(x => x[1]), 1);
  const resumen = [pc.length ? `<b>${pc.length}</b> ${pc.length === 1 ? 'cliente para consultar' : 'clientes para consultar'}` : null, es.length ? `<b>${es.length}</b> esperando respuesta` : null, ap.length ? `<b>${ap.length}</b> ${ap.length === 1 ? 'pedido para preparar' : 'pedidos para preparar'}` : null].filter(Boolean);
  return banner() + `
  <div class="card" style="margin-bottom:18px;background:linear-gradient(120deg,#fffcf7 55%,#f6e7d6)">
    <div class="row"><div><div style="font-family:var(--serif);font-size:22px;font-weight:700">${saludo} ☕</div>
    <div class="muted">${resumen.length ? 'Hoy tenés ' + resumen.join(', ') + '.' : 'Todo al día: no hay consultas ni pedidos pendientes.'}</div></div></div>
  </div>
  <div class="kpis">
    <div class="kpi hl"><div class="l">Consultas para enviar</div><div class="v">${pc.length}</div><div class="s">próximos ${S.config.diasAnticipacion} días</div></div>
    <div class="kpi"><div class="l">Esperando respuesta</div><div class="v">${es.length}</div><div class="s">consultas enviadas</div></div>
    <div class="kpi"><div class="l">Pedidos a preparar</div><div class="v">${ap.length}</div><div class="s">${apKg.toLocaleString('es-AR')} kg de café</div></div>
    <div class="kpi"><div class="l">Clientes activos</div><div class="v">${act.length}</div><div class="s">${act.length - nLoc} personas · ${nLoc} locales</div></div>
    <div class="kpi"><div class="l">Facturado en ${MESES_L[d.getMonth()]}</div><div class="v">${money(facMes)}</div><div class="s">${compMes.length} comprobantes · ${kgMes.toLocaleString('es-AR')} kg</div></div>
  </div>
  <div class="grid g-main">
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="card-head"><h2>Para consultar por WhatsApp</h2><span class="right"><button class="btn ghost sm" data-act="go" data-id="consultas">Ver todas →</button></span></div>
        ${pc.length ? `<div class="list">${pc.slice(0,5).map(c => liConsulta(c)).join('')}</div>` : emptyBox('No hay consultas pendientes. Los clientes aparecen acá unos días antes de su entrega.')}
      </div>
      <div class="card">
        <div class="card-head"><h2>Facturación por mes</h2><span class="right tiny muted">comprobantes emitidos</span></div>
        <div class="bars">${meses.map((m,i) => `<div class="bar ${i === 3 ? 'cur' : ''}"><span class="bv">${facs[i] ? money(facs[i]).replace('$ ','$') : '—'}</span><div class="col" style="height:${Math.max(4, facs[i] / maxF * 120)}px"></div><span class="bl">${MESES[+m.slice(5)-1]}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="card-head"><h2>Pedidos a preparar</h2><span class="right"><button class="btn ghost sm" data-act="go" data-id="pedidos">Ver →</button></span></div>
        ${ap.length ? `<div class="list">${ap.slice(0,6).map(p => { const c = cli(p.clienteId) || {nombre:'?'}; return `<div class="li"><div class="avatar ${c.tipo === 'local' ? 'local' : ''}">${initials(c.nombre)}</div><div class="main"><div class="t">${esc(c.nombre)}</div><div class="d">${esc(itemsTxt(p.items))}</div></div><div style="text-align:right">${estadoBadge(p.estado)}<div class="tiny muted" style="margin-top:4px">${fmtDate(p.fecha)}</div></div></div>`; }).join('')}</div>` : emptyBox('Sin pedidos pendientes.')}
      </div>
      ${es.length ? `<div class="card"><div class="card-head"><h2>Esperando respuesta</h2></div><div class="list">${es.map(c => `<div class="li"><div class="avatar ${c.tipo === 'local' ? 'local' : ''}">${initials(c.nombre)}</div><div class="main"><div class="t">${esc(c.nombre)}</div><div class="d">Consulta enviada ${ago(c.consulta.fecha)}</div></div><button class="btn sm primary" data-act="responder" data-id="${c.id}">Registrar respuesta</button></div>`).join('')}</div></div>` : ''}
      ${pr.length ? `<div class="card"><div class="card-head"><h2>Suscripciones por vencer</h2></div><div class="list">${pr.map(c => `<div class="li"><div class="main"><div class="t">${esc(c.nombre)}</div><div class="d">Vence ${fmtDate(planFin(c))} (${rel(planFin(c))})</div></div><button class="btn sm wa" data-act="waRenov" data-id="${c.id}">${WA_IC(14)} Avisar</button></div>`).join('')}</div></div>` : ''}
      <div class="card">
        <div class="card-head"><h2>Café más vendido</h2><span class="right tiny muted">últimos 30 días</span></div>
        ${kgArr.length ? kgArr.map(([id,kg]) => `<div class="hbar"><span>${esc(cafe(id).nombre)}</span><div class="track"><div class="fill" style="width:${kg / maxKg * 100}%"></div></div><span class="num">${kg.toLocaleString('es-AR')} kg</span></div>`).join('') : emptyBox('Sin ventas aún.')}
      </div>
    </div>
  </div>`;
}
function liConsulta(c){
  const n = diffDays(today(), c.proxima);

const emptyBox = t => `<div class="empty">${ic('bean', 28)}<div>${t}</div></div>`;
const estadoBadge = e => ({pendiente:'<span class="badge b-warn">Pendiente</span>', preparado:'<span class="badge b-accent">Preparado</span>', entregado:'<span class="badge b-ok">Entregado</span>', cancelado:'<span class="badge b-danger">Cancelado</span>'})[e] || e;

        <div class="row"><button class="btn wa" data-act="enviarConsulta" data-id="${c.id}">${WA_IC()} Enviar consulta</button><button class="btn ghost sm" data-act="responder" data-id="${c.id}">Ya respondió</button></div></div>`;

  } else if (UI.conTab === 'esperando') {
    body = es.length ? `<div class="qgrid">${es.map(c => `<div class="qcard"><div class="top"><div class="avatar ${c.tipo === 'local' ? 'local' : ''}">${initials(c.nombre)}</div><div style="flex:1"><div style="font-weight:700">${esc(c.nombre)}</div><div class="tiny muted">Enviado ${ago(c.consulta.fecha)} · entrega ${fmtDate(c.proxima)}</div></div></div>
      <div class="small">${esc(itemsTxt(c.items))}</div>
      <div class="row"><button class="btn primary sm" data-act="responder" data-id="${c.id}">${ic('check',15)} Quiere su café</button><button class="btn sm" data-act="saltear" data-id="${c.id}">${ic('x',15)} Esta vez no</button><button class="btn ghost sm" data-act="enviarConsulta" data-id="${c.id}">${WA_IC(14)} Reenviar</button></div></div>`).join('')}</div>` : `<div class="card">${emptyBox('Nadie pendiente de responder.')}</div>`;
  } else {
    body = `<div class="card">${hist.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Detalle</th></tr></thead><tbody>${hist.map(m => `<tr><td class="tiny">${new Date(m.fecha).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</td><td>${esc(cli(m.clienteId)?.nombre || '—')}</td><td><span class="badge">${esc(m.tipo)}</span></td><td class="small">${esc(m.texto)}</td></tr>`).join('')}</tbody></table></div>` : emptyBox('Todavía no se enviaron mensajes.')}</div>`;

/* ================= VISTA: PEDIDOS ================= */

  const cnt = id => S.pedidos.filter(filtroPed(id)).length;
  const list = S.pedidos.filter(filtroPed(UI.pedTab)).sort((a,b) => UI.pedTab === 'entregado' || UI.pedTab === 'todos' ? b.fecha.localeCompare(a.fecha) : a.fecha.localeCompare(b.fecha));
  // hoja de producción
  const ap = aPreparar(); const prod = {};
  ap.forEach(p => p.items.forEach(i => { const k = i.cafeId + '|' + i.molienda; prod[k] = (prod[k] || 0) + pres(i.presId).gramos * i.cant / 1000; }));

    <div class="row" style="gap:10px">${prodArr.map(([k,kg]) => { const [cid, mol] = k.split('|'); return `<div class="prod-chip"><b>${kg.toLocaleString('es-AR')} kg</b><div class="small">${esc(cafe(cid).nombre)}</div><div class="tiny muted">${esc(molLabel(mol))}</div></div>`; }).join('')}</div></div>` : ''}
  <div class="tabs">${tabs.map(([id,t]) => `<button class="tab ${UI.pedTab === id ? 'active' : ''}" data-act="pedTab" data-id="${id}">${t}<span class="n">${cnt(id)}</span></button>`).join('')}</div>
  <div class="card">${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Entrega</th><th>Cliente</th><th>Detalle</th><th class="num">Total</th><th>Estado</th><th>Cobro</th><th></th></tr></thead><tbody>
  ${list.map(p => { const c = cli(p.clienteId) || {nombre:'(eliminado)'}; const comp = p.compId && S.comprobantes.find(x => x.id === p.compId);
    return `<tr><td><b>${fmtDate(p.fecha)}</b><div class="tiny muted">${rel(p.fecha)}</div></td><td>${esc(c.nombre)}<div>${c.tipo ? tipoBadge(c) : ''}</div></td><td class="small">${esc(itemsTxt(p.items))}${p.nota ? `<div class="tiny muted">📝 ${esc(p.nota)}</div>` : ''}</td>
    <td class="num">${money(p.total)}<div class="tiny muted">${itemsKg(p.items).toLocaleString('es-AR')} kg</div></td><td>${estadoBadge(p.estado)}</td>
    <td>${p.enAbono ? '<span class="badge">En abono</span>' : p.pagado ? '<span class="badge b-ok">Cobrado</span>' : `<button class="btn sm" data-act="pagarPedido" data-id="${p.id}">Marcar cobrado</button>`}</td>
    <td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
      ${p.estado === 'pendiente' ? `<button class="btn sm" data-act="estadoPed" data-id="${p.id}">Preparado</button>` : ''}
      ${p.estado === 'preparado' ? `<button class="btn sm wa" data-act="avisarListo" data-id="${p.id}" title="Avisar por WhatsApp">${WA_IC(14)}</button><button class="btn sm primary" data-act="estadoPed" data-id="${p.id}">Entregado</button>` : ''}
      ${!p.enAbono && p.estado !== 'cancelado' ? (comp ? `<button class="btn sm ghost" data-act="verComp" data-id="${comp.id}">${ic('receipt',15)} ${comp.letra} ${String(comp.numero).padStart(5,'0')}</button>` : `<button class="btn sm ghost" data-act="facturarPedido" data-id="${p.id}">${ic('receipt',15)} Comprobante</button>`) : ''}
      ${p.estado === 'pendiente' ? `<button class="btn sm ghost danger" data-act="cancelarPed" data-id="${p.id}" title="Cancelar">${ic('x',15)}</button>` : ''}
    </div></td></tr>`; }).join('')}
  </tbody></table></div>` : emptyBox('No hay pedidos en esta lista.')}</div>`;
}
const filtroPed = id => p => id === 'todos' ? true : id === 'impagos' ? (!p.pagado && !p.enAbono && p.estado !== 'cancelado') : p.estado === id;

/* ================= VISTA: SUSCRIPCIONES ================= */
function vSuscripciones(){
  const mk = monthKey(today());
  setTop('Suscripciones', 'Mensualidades (abonos) y planes con duración elegida por el cliente', '');
  const subs = S.clientes.filter(c => c.plan.cobro === 'abono');
  const act = subs.filter(c => c.estado === 'activo');
  const mrr = act.reduce((s,c) => s + abonoMensual(S, c), 0);
  const abMes = S.abonos.filter(a => a.periodo === mk);
  const sinFact = act.filter(c => !abMes.find(a => a.clienteId === c.id));
  const impagos = S.abonos.filter(a => !a.pagado);
  const conDur = S.clientes.filter(c => c.plan.duracionMeses > 0);
  return `<div class="kpis" style="grid-template-columns:repeat(4,1fr)">

function vFacturacion(){
  setTop('Facturación', 'Comprobantes y resumen mensual para cargar en ARCA', `<button class="btn" data-act="printResumen">${ic('print',16)} Imprimir resumen</button><button class="btn primary" data-act="exportCSV">${ic('download',16)} Exportar para ARCA</button>`);
  const mk = UI.facMes;
  const comps = S.comprobantes.filter(c => monthKey(c.fecha) === mk).sort((a,b) => a.letra.localeCompare(b.letra) || a.numero - b.numero);
  const total = comps.reduce((s,c) => s + c.total, 0), iva = comps.reduce((s,c) => s + c.iva, 0);
  const cobrado = comps.filter(compPagado).reduce((s,c) => s + c.total, 0);
  const porLocal = comps.filter(c => cli(c.clienteId)?.tipo === 'local').reduce((s,c) => s + c.total, 0);
  return `<div class="row" style="margin-bottom:14px"><div class="field" style="max-width:220px"><label for="facMes">Mes</label><input type="month" id="facMes" value="${mk}"></div><div class="spacer"></div><span class="muted small">Condición: <b>${esc(S.config.condIva)}</b> · Punto de venta ${String(S.config.ptoVta).padStart(4,'0')}</span></div>
  <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi hl"><div class="l">Total facturado</div><div class="v">${money(total)}</div><div class="s">${comps.length} comprobantes</div></div>
    <div class="kpi"><div class="l">Cobrado</div><div class="v">${money(cobrado)}</div><div class="s">${total ? Math.round(cobrado / total * 100) : 0}% del total</div></div>
    <div class="kpi"><div class="l">Pendiente de cobro</div><div class="v">${money(total - cobrado)}</div><div class="s">&nbsp;</div></div>
    <div class="kpi"><div class="l">${iva ? 'IVA débito' : 'A locales / a personas'}</div><div class="v">${iva ? money(iva) : money(porLocal)}</div><div class="s">${iva ? 'incluido en el total' : 'personas: ' + money(total - porLocal)}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">${comps.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Cliente</th><th>Doc.</th><th>Concepto</th><th class="num">Total</th><th>Cobro</th><th></th></tr></thead><tbody>
  ${comps.map(c => `<tr class="click" data-act="verComp" data-id="${c.id}"><td>${fmtDMY(c.fecha)}</td><td><b>${c.letra}</b> ${fmtNum(c.ptoVta, c.numero)}</td><td>${esc(c.cliente.nombre)}</td><td class="small">${esc(c.cliente.docTipo)} ${esc(c.cliente.docNro || '—')}</td><td class="small">${c.periodo ? 'Abono ' + monthLabel(c.periodo) : 'Pedido'}</td><td class="num"><b>${money(c.total)}</b></td><td>${compPagado(c) ? '<span class="badge b-ok">Cobrado</span>' : '<span class="badge b-danger">Pendiente</span>'}</td><td>${ic('receipt',16)}</td></tr>`).join('')}
  </tbody></table></div>` : emptyBox('No hay comprobantes en este mes.')}</div>
  <div class="info"><b>¿Cómo se presenta en ARCA?</b>
    <ol><li>Tocá <b>Exportar para ARCA</b>: se descarga una planilla (se abre con Excel) con todos los comprobantes del mes: fecha, tipo, número, CUIT/DNI del cliente e importes.</li>
    <li>Entrá a ARCA con tu clave fiscal → <b>Comprobantes en línea</b> y cargá cada comprobante con esos datos, o pasale la planilla a tu contador.</li>
    <li>Con <b>Imprimir resumen</b> tenés una hoja con el detalle y los totales del mes para archivar.</li></ol>
    <div class="tiny" style="margin-top:6px">En esta versión BETA los comprobantes son internos (no tienen CAE). La emisión automática de factura electrónica conectada a ARCA se puede sumar en una versión siguiente.</div></div>`;
}
function compPagado(c){
  if (c.pedidoId) { const p = S.pedidos.find(x => x.id === c.pedidoId); return p ? p.pagado : false; }
  const a = S.abonos.find(x => x.compId === c.id); return a ? a.pagado : false;
}

/* ================= EDITOR DE ÍTEMS ================= */
function itemsEditor(id, items, lista){
  const rows = (items.length ? items : [{cafeId:S.cafes[0]?.id, presId:S.presentaciones[0]?.id, cant:1, molienda:'En grano'}]).map(itemRow).join('');
  return `<div class="items-editor" id="${id}" data-lista="${lista}"><div class="irow ihead"><span>Café</span><span>Tamaño</span><span>Cant.</span><span>¿En grano o molido?</span><span></span></div>${rows}</div>
  <div class="row"><button type="button" class="btn sm" data-act="addItemRow" data-id="${id}">${ic('plus',15)} Agregar café</button><div class="spacer"></div><div class="items-total" id="${id}_tot"></div></div>`;
}
function itemRow(it){
  return `<div class="irow item-row">
    <select class="i-cafe">${S.cafes.map(c => `<option value="${c.id}" ${c.id === it.cafeId ? 'selected' : ''} ${!c.activo ? 'disabled' : ''}>${esc(c.nombre)}${c.activo ? '' : ' (sin stock)'}</option>`).join('')}</select>
    <select class="i-pres">${S.presentaciones.map(p => `<option value="${p.id}" ${p.id === it.presId ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>
    <input type="number" class="i-cant" min="1" value="${it.cant || 1}">
    <select class="i-mol">${S.moliendas.map(m => `<option value="${esc(m)}" ${m === it.molienda ? 'selected' : ''}>${m === 'En grano' ? 'En grano' : 'Molido · ' + esc(m)}</option>`).join('')}</select>
    <button type="button" class="btn sm ghost danger" data-act="delItemRow" title="Quitar">${ic('x',15)}</button></div>`;
}
function readItems(id){
  const ed = document.getElementById(id); const lista = ed.dataset.lista;
  return Array.from(ed.querySelectorAll('.item-row')).map(r => {
    const it = {cafeId:r.querySelector('.i-cafe').value, presId:r.querySelector('.i-pres').value, cant:Math.max(1, parseInt(r.querySelector('.i-cant').value) || 1), molienda:r.querySelector('.i-mol').value};
    it.precio = precio(it.cafeId, it.presId, lista); return it;
  });
}
function updTotals(){
  $$('.items-editor').forEach(ed => {
    const items = readItems(ed.id); const tot = document.getElementById(ed.id + '_tot');
    if (tot) tot.innerHTML = `<span>${itemsKg(items).toLocaleString('es-AR')} kg</span><span>Total <b>${money(items.reduce((s,i) => s + i.precio * i.cant, 0))}</b></span>`;
  });
}

function download(name, content, type){ const b = new Blob([content], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200); }
function exportCSV(){
  const mk = UI.facMes; const comps = S.comprobantes.filter(c => monthKey(c.fecha) === mk).sort((a,b) => a.fecha.localeCompare(b.fecha) || a.numero - b.numero);
  if (!comps.length) { toast('No hay comprobantes en ese mes'); return; }
  const n2 = n => n.toFixed(2).replace('.', ',');
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const head = ['Fecha','Tipo comprobante','Punto de venta','Número','Tipo doc. receptor','Nro. doc. receptor','Denominación receptor','Condición IVA receptor','Concepto','Neto gravado','IVA 21%','No gravado / Exento','Importe total','Cobrado'];
  const rows = comps.map(c => [fmtDMY(c.fecha), 'Factura ' + c.letra, String(c.ptoVta).padStart(4,'0'), String(c.numero).padStart(8,'0'), c.cliente.docTipo, c.cliente.docNro || '', c.cliente.nombre, c.cliente.condIva, 'Productos', n2(c.letra === 'C' ? 0 : c.neto), n2(c.iva), n2(c.letra === 'C' ? c.total : 0), n2(c.total), compPagado(c) ? 'Sí' : 'No'].map(q).join(';'));
  const tot = comps.reduce((s,c) => s + c.total, 0);
  rows.push(['','','','','','','TOTAL','','','','','',n2(tot),''].map(q).join(';'));
  download(`ARCA_${S.config.negocio.replace(/\W+/g,'_')}_${mk}.csv`, '﻿' + head.map(q).join(';') + '\n' + rows.join('\n'), 'text/csv;charset=utf-8');
  toast('Planilla descargada');
}

  enviarConsulta: id => { const c = cli(id); openWA(waLink(c.tel, fill(S.config.plantillas.consulta, varsFor(c)))); marcarConsulta(c); closeModal(); toast(`Consulta enviada a ${c.nombre}`); render(); },
  responder: id => modalResponder(id),
  saltear: id => { const c = cli(id); avanzarCiclo(c); logMsg(c.id, 'respuesta', 'Esta vez no quiere café'); closeModal(); toast(`Salteado — próxima consulta ${fmtDate(c.proxima)}`); render(); },
  confirmarPedido,
  ronda: startRonda,
  rondaSend: () => { const c = cli(RONDA.q[RONDA.i]); openWA(waLink(c.tel, val('rondaMsg'))); marcarConsulta(c); RONDA.enviados++; RONDA.i++; showRonda(); },
  rondaSkip: () => { RONDA.i++; showRonda(); },
  closeRonda: () => { RONDA = null; closeModal(); render(); },
  newPedido: () => modalNuevoPedido(),
  newPedidoCli: id => modalNuevoPedido(id),
  saveNuevoPedido: () => { const c = cli(val('n_cli')); const items = readItems('edNew'); if (!items.length) { toast('Agregá al menos un café'); return; } crearPedido(c, items, val('n_fecha') || today(), val('n_nota'), 'manual'); closeModal(); UI.view = 'pedidos'; UI.pedTab = 'pendiente'; toast('Pedido creado'); render(); },
  estadoPed: id => { const p = S.pedidos.find(x => x.id === id); p.estado = p.estado === 'pendiente' ? 'preparado' : 'entregado'; toast(p.estado === 'preparado' ? 'Pedido preparado' : 'Pedido entregado'); render(); },
  cancelarPed: id => { if (!confirm('¿Cancelar este pedido?')) return; S.pedidos.find(x => x.id === id).estado = 'cancelado'; render(); },
  pagarPedido: id => { S.pedidos.find(x => x.id === id).pagado = true; toast('Marcado como cobrado'); render(); },
  avisarListo: id => { const p = S.pedidos.find(x => x.id === id), c = cli(p.clienteId); openWA(waLink(c.tel, fill(S.config.plantillas.pedidoListo, varsFor(c, {pedido:itemsTxt(p.items), total:money(p.total)})))); logMsg(c.id, 'aviso', 'Aviso de pedido listo'); save(); },
  facturarPedido: id => { const p = S.pedidos.find(x => x.id === id), c = cli(p.clienteId); const comp = crearComprobante(S, c, itemsComp(S, p.items), today(), {pedidoId:p.id}); p.compId = comp.id; render(); modalComp(comp.id); },
  verComp: id => modalComp(id),
  printComp: id => printHTML(compSheet(S.comprobantes.find(x => x.id === id))),
  waComp: id => { const k = S.comprobantes.find(x => x.id === id), c = cli(k.clienteId); openWA(waLink(c.tel, `¡Hola ${firstName(c)}! Te pasamos el detalle de tu compra en ${S.config.negocio}:\n\nComprobante ${k.letra} ${fmtNum(k.ptoVta, k.numero)} — ${fmtDMY(k.fecha)}\n${k.items.map(i => `• ${i.cant} × ${i.desc}: ${money(i.subtotal)}`).join('\n')}\n\nTotal: ${money(k.total)}\nAlias para transferir: ${S.config.alias}\n¡Gracias! ☕`)); },
  newCliente: () => modalCliente(null),
  editCliente: id => modalCliente(cli(id)),
  verCliente: id => modalVerCliente(id),
  saveCliente: id => saveCliente(id),
  delCliente: id => { if (!confirm('¿Eliminar este cliente? Sus comprobantes se conservan.')) return; S.clientes = S.clientes.filter(c => c.id !== id); S.pedidos = S.pedidos.filter(p => p.clienteId !== id || p.compId); closeModal(); render(); },
  togglePausa: id => { const c = cli(id); c.estado = c.estado === 'pausado' ? 'activo' : 'pausado'; if (c.estado === 'activo' && c.proxima < today()) c.proxima = today(); closeModal(); toast(c.estado === 'pausado' ? 'Cliente pausado' : 'Cliente reactivado'); render(); },
  addItemRow: id => { const ed = document.getElementById(id); ed.insertAdjacentHTML('beforeend', itemRow({cafeId:S.cafes.find(c => c.activo)?.id, presId:S.presentaciones[0]?.id, cant:1, molienda:'En grano'})); updTotals(); updAbonoHint(); },
  delItemRow: (id, el) => { const ed = el.closest('.items-editor'); if (ed.querySelectorAll('.item-row').length > 1) el.closest('.item-row').remove(); updTotals(); updAbonoHint(); },
  facturarAbono: id => { const c = cli(id); const mk = monthKey(today()); const monto = abonoMensual(S, c); const ab = {id:uid(), clienteId:c.id, periodo:mk, monto, compId:null, pagado:false}; const comp = crearComprobante(S, c, [{desc:`Abono mensual de café — ${monthLabel(mk)} (${itemsTxt(c.items)}, ${freqTxt(c.plan.frecuenciaDias).toLowerCase()})`, cant:1, unit:monto, subtotal:monto}], today(), {periodo:mk}); ab.compId = comp.id; S.abonos.push(ab); toast(`Abono de ${c.nombre} facturado`); render(); },
  facturarTodos: () => { const mk = monthKey(today()); S.clientes.filter(c => c.plan.cobro === 'abono' && c.estado === 'activo' && !S.abonos.find(a => a.clienteId === c.id && a.periodo === mk)).forEach(c => A.facturarAbono(c.id)); toast('Abonos del mes facturados'); },
  pagarAbono: id => { S.abonos.find(a => a.id === id).pagado = true; toast('Abono cobrado'); render(); },
  waCobro: id => { const a = S.abonos.find(x => x.id === id), c = cli(a.clienteId); openWA(waLink(c.tel, fill(S.config.plantillas.cobro, varsFor(c, {mes:monthLabel(a.periodo), monto:money(a.monto)})))); logMsg(c.id, 'cobro', `Recordatorio de pago ${monthLabel(a.periodo)}`); save(); },
  waRenov: id => { const c = cli(id); openWA(waLink(c.tel, fill(S.config.plantillas.renovacion, varsFor(c)))); logMsg(c.id, 'renovación', 'Aviso de vencimiento de suscripción'); save(); toast('Aviso enviado'); },
  renovar: id => { const c = cli(id); openModal(`<h2>Renovar suscripción</h2><p class="muted small">${esc(c.nombre)} · vence ${fmtDMY(planFin(c))}</p><div class="row" style="margin-top:14px">${[1,3,6,12].map(m => `<button class="btn" data-act="doRenovar" data-id="${c.id}|${m}">+${m} ${m === 1 ? 'mes' : 'meses'}</button>`).join('')}<button class="btn" data-act="doRenovar" data-id="${c.id}|0">Sin vencimiento</button></div><div class="row" style="margin-top:12px"><button class="btn wa" data-act="waRenov" data-id="${c.id}">${WA_IC()} Preguntarle por WhatsApp</button></div><div class="modal-foot"><button class="btn" data-act="close">Cerrar</button></div>`, 'narrow'); },
  doRenovar: v => { const [id, m] = v.split('|'); const c = cli(id); c.plan.duracionMeses = +m === 0 ? 0 : c.plan.duracionMeses + +m; if (c.estado !== 'activo') c.estado = 'activo'; logMsg(c.id, 'renovación', +m ? `Renovó por ${m} meses` : 'Renovó sin vencimiento'); closeModal(); toast('Suscripción renovada'); render(); },
  editTpl: k => modalTpl(k),
  insVar: v => { const t = $('#tplEdit'); const s = t.selectionStart; t.value = t.value.slice(0, s) + v + t.value.slice(t.selectionEnd); t.focus(); t.selectionStart = t.selectionEnd = s + v.length; updTplPrev(); },
  saveTpl: k => { S.config.plantillas[k] = val('tplEdit'); closeModal(); toast('Mensaje guardado'); render(); },
  tplDefault: k => { $('#tplEdit').value = DEFAULT_TPL[k]; updTplPrev(); },
  editCafe: id => modalCafe(id),
  saveCafe: id => { const nombre = val('k_nom').trim(); if (!nombre) { toast('Poné un nombre'); return; } const d = {nombre, origen:val('k_ori'), tueste:val('k_tue'), activo:val('k_act') === '1', kgMin:+val('k_min') || 0, kgMay:+val('k_may') || 0, notas:val('k_not')}; if (id) Object.assign(S.cafes.find(x => x.id === id), d); else S.cafes.push({id:uid(), ...d}); closeModal(); toast('Catálogo actualizado'); render(); },
  delCafe: id => { if (S.clientes.some(c => c.items.some(i => i.cafeId === id))) { toast('Hay clientes con este café en su pedido habitual. Marcalo “Sin stock”.'); return; } if (!confirm('¿Eliminar este café?')) return; S.cafes = S.cafes.filter(c => c.id !== id); closeModal(); render(); },
  addPres: () => { const g = parseInt(val('newPresG')); if (!g || g < 50) { toast('Ingresá los gramos'); return; } S.presentaciones.push({id:uid(), nombre: g >= 1000 && g % 1000 === 0 ? `${g / 1000} kg` : `${g} g`, gramos:g}); S.presentaciones.sort((a,b) => a.gramos - b.gramos); render(); },
  delPres: id => { if (S.clientes.some(c => c.items.some(i => i.presId === id))) { toast('Hay clientes usando esa presentación.'); return; } if (S.presentaciones.length <= 1) return; S.presentaciones = S.presentaciones.filter(p => p.id !== id); render(); },
  addMol: () => { const m = val('newMol').trim(); if (!m) return; if (!S.moliendas.includes(m)) S.moliendas.push(m); render(); },
  delMol: i => { S.moliendas.splice(+i, 1); render(); },
  saveAjustes: () => {
    const c = S.config; c.negocio = val('a_neg').trim() || c.negocio; c.razon = val('a_raz'); c.cuit = val('a_cuit'); c.condIva = val('a_iva'); c.ptoVta = Math.max(1, +val('a_pv') || 1); c.whatsapp = val('a_wa'); c.direccion = val('a_dir'); c.alias = val('a_alias'); c.diasAnticipacion = Math.max(0, +val('a_dias') || 0);
    ['consulta','pedidoListo','cobro','renovacion'].forEach(k => c.plantillas[k] = val('tpl_' + k));
    toast('Ajustes guardados'); render();
  },
  exportJSON: () => download(`gestor-cafe-copia-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'),
  resetDemo: () => { if (!confirm('Se borran tus cambios y se vuelve a cargar la demo. ¿Seguir?')) return; localStorage.removeItem(LS_KEY); S = seed(); UI.view = 'inicio'; toast('Datos de ejemplo restaurados'); render(); },
  printResumen, printProd, exportCSV
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) { e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener('input', e => {
  if (e.target.closest('.items-editor')) { updTotals(); updAbonoHint(); }
  if (['f_desc','f_freqx'].includes(e.target.id)) updAbonoHint();
  if (e.target.id === 'tplEdit') updTplPrev();
  if (e.target.id === 'cliQ') { UI.cliQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#cliQ'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('.items-editor')) { updTotals(); updAbonoHint(); }
  if (t.id === 'f_freq') { $('#f_freqx').style.display = t.value === 'x' ? '' : 'none'; updAbonoHint(); }
  if (t.id === 'f_dur') $('#f_durx').style.display = t.value === 'x' ? '' : 'none';
  if (t.id === 'f_cobro') updAbonoHint();
  if (t.id === 'f_lista') { $('#edCli').dataset.lista = t.value; updTotals(); updAbonoHint(); }
  if (t.name === 'f_tipo') { const l = t.value === 'local' ? 'mayorista' : 'minorista'; $('#f_lista').value = l; $('#edCli').dataset.lista = l; updTotals(); updAbonoHint(); }
  if (t.id === 'n_cli') { const c = cli(t.value); $('#n_items').innerHTML = itemsEditor('edNew', c.items, c.lista); updTotals(); }
  if (t.id === 'facMes') { UI.facMes = t.value || monthKey(today()); render(); }
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.clientes || !d.config) throw 0; S = d; toast('Copia cargada'); render(); } catch(err) { toast('El archivo no es una copia válida'); } }; r.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#sidebar').classList.remove('open'); } });
S = load() || seed();
render();
</script>
</body>
</html>
